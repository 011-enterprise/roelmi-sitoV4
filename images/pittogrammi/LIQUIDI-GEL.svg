<svg class="pg pg--gel" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 760" aria-hidden="true" focusable="false">
  <defs>
    <!-- Vetro: più chiaro in alto a sinistra (luce), quasi trasparente in basso a destra -->
    <linearGradient id="pgGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.22"/>
    </linearGradient>
    <!-- Contorno: pieno dove batte la luce, più tenue nell'ombra -->
    <linearGradient id="pgLine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.9"/>
    </linearGradient>
    <!-- Ombra del gel sulla goccia: profondità -->
    <filter id="pgShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#191919" flood-opacity="0.2"/>
    </filter>
    <radialGradient id="pgCore" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#fff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.16"/>
    </radialGradient>
    <!-- Luce unica su tutto il gel (coordinate della pagina, non di ogni bolla) -->
    <radialGradient id="pgGelCore" gradientUnits="userSpaceOnUse" cx="330" cy="470" r="330">
      <stop offset="0" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.18"/>
    </radialGradient>
    <!-- Forma del gel (riempimento) -->
    <mask id="pgGelFill" maskUnits="userSpaceOnUse" x="0" y="0" width="520" height="760">
        <circle cx="430" cy="423" r="82" fill="#fff"/>
        <circle cx="356" cy="600" r="62" fill="#fff"/>
        <circle cx="222" cy="700" r="49" fill="#fff"/>
        <path d="M355.9 458.1Q384.5 518.8 335.5 541.5L412 573.5Q393.8 522.7 457.1 500.4Z" fill="#fff"/>
        <path d="M294.3 594.3Q280.8 649.9 231.6 651.9L270.8 704.5Q286.8 657.9 343.9 660.8Z" fill="#fff"/>
    </mask>
    <!-- Solo il bordo esterno del gel: forma allargata meno forma piena -->
    <mask id="pgGelEdge" maskUnits="userSpaceOnUse" x="0" y="0" width="520" height="760">
        <circle cx="430" cy="423" r="82" fill="#fff" stroke="#fff" stroke-width="5.2"/>
        <circle cx="356" cy="600" r="62" fill="#fff" stroke="#fff" stroke-width="5.2"/>
        <circle cx="222" cy="700" r="49" fill="#fff" stroke="#fff" stroke-width="5.2"/>
        <path d="M355.9 458.1Q384.5 518.8 335.5 541.5L412 573.5Q393.8 522.7 457.1 500.4Z" fill="#fff" stroke="#fff" stroke-width="5.2"/>
        <path d="M294.3 594.3Q280.8 649.9 231.6 651.9L270.8 704.5Q286.8 657.9 343.9 660.8Z" fill="#fff" stroke="#fff" stroke-width="5.2"/>
        <circle cx="430" cy="423" r="82" fill="#000"/>
        <circle cx="356" cy="600" r="62" fill="#000"/>
        <circle cx="222" cy="700" r="49" fill="#000"/>
        <path d="M355.9 458.1Q384.5 518.8 335.5 541.5L412 573.5Q393.8 522.7 457.1 500.4Z" fill="#000"/>
        <path d="M294.3 594.3Q280.8 649.9 231.6 651.9L270.8 704.5Q286.8 657.9 343.9 660.8Z" fill="#000"/>
    </mask>
  </defs>
  <g class="pg-drop">
    <path class="pg-glass" d="M241 4C214 60 4 318 4 490A237 237 0 0 0 478 490C478 318 268 60 241 4Z" fill="url(#pgGlass)"/>
    <path class="pg-outline" d="M241 4C214 60 4 318 4 490A237 237 0 0 0 478 490C478 318 268 60 241 4Z" fill="none" stroke="url(#pgLine)" stroke-width="2.6" stroke-linejoin="round" pathLength="1"/>
  </g>
  <g class="pg-inner" filter="url(#pgShadow)">
    <g class="pg-grain" style="--i:0">
      <rect width="520" height="760" fill="url(#pgGelCore)" mask="url(#pgGelFill)"/>
      <rect width="520" height="760" fill="#fff" mask="url(#pgGelEdge)"/>
    </g>
    <circle class="pg-grain" style="--i:1" cx="116" cy="696" r="33" fill="url(#pgCore)" stroke="#fff" stroke-width="2.6"/>
  </g>
</svg>
