    <rect class="pg-line" mask="url(#pgm3)" x="0" y="0" width="520" height="760" fill="#fff"/>
  </g>
  <g class="pg-arc" style="--i:4">
    <path class="pg-glass" d="M150.0 544.9A177 177 0 0 0 494.4 605.6" stroke="rgba(255,255,255,0.34)" stroke-width="24" stroke-linecap="round" fill="none"/>
