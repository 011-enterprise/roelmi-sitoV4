<svg class="pg pg--liquid" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 760" aria-hidden="true" focusable="false">
  <defs>
    <!-- Vetro: più chiaro in alto a sinistra (luce), quasi trasparente in basso a destra -->
    <linearGradient id="pgGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.22"/>
    </linearGradient>
    <!-- Contorno: pieno dove batte la luce, più tenue nell'ombra -->
    <linearGradient id="pgLine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.9"/>
    </linearGradient>
    <!-- Ombra degli elementi interni sulla goccia: profondità -->
    <filter id="pgShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#191919" flood-opacity="0.2"/>
    </filter>
    <radialGradient id="pgCore" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#fff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.18"/>
    </radialGradient>
    <mask id="pgm0" maskUnits="userSpaceOnUse" x="0" y="0" width="520" height="760">
      <path d="M232.7 504.0A104 104 0 0 0 371.0 642.3" stroke="#fff" stroke-width="29.2" stroke-linecap="round" fill="none"/>
      <path d="M232.7 504.0A104 104 0 0 0 371.0 642.3" stroke="#000" stroke-width="24" stroke-linecap="round" fill="none"/>
    </mask>
    <mask id="pgm1" maskUnits="userSpaceOnUse" x="0" y="0" width="520" height="760">
      <path d="M259.9 448.5A120 120 0 0 1 439.8 589.0" stroke="#fff" stroke-width="29.2" stroke-linecap="round" fill="none"/>
      <path d="M259.9 448.5A120 120 0 0 1 439.8 589.0" stroke="#000" stroke-width="24" stroke-linecap="round" fill="none"/>
    </mask>
    <mask id="pgm2" maskUnits="userSpaceOnUse" x="0" y="0" width="520" height="760">
      <path d="M248.8 380.3A185 185 0 0 1 304.5 364.4" stroke="#fff" stroke-width="29.2" stroke-linecap="round" fill="none"/>
      <path d="M248.8 380.3A185 185 0 0 1 304.5 364.4" stroke="#000" stroke-width="24" stroke-linecap="round" fill="none"/>
    </mask>
    <mask id="pgm3" maskUnits="userSpaceOnUse" x="0" y="0" width="520" height="760">
      <path d="M366.6 376.5A176 176 0 0 1 501.7 569.4" stroke="#fff" stroke-width="29.2" stroke-linecap="round" fill="none"/>
      <path d="M366.6 376.5A176 176 0 0 1 501.7 569.4" stroke="#000" stroke-width="24" stroke-linecap="round" fill="none"/>
    </mask>
    <mask id="pgm4" maskUnits="userSpaceOnUse" x="0" y="0" width="520" height="760">
      <path d="M150.0 544.9A177 177 0 0 0 494.4 605.6" stroke="#fff" stroke-width="29.2" stroke-linecap="round" fill="none"/>
      <path d="M150.0 544.9A177 177 0 0 0 494.4 605.6" stroke="#000" stroke-width="24" stroke-linecap="round" fill="none"/>
    </mask>
  </defs>
  <g class="pg-drop">
    <path class="pg-glass" d="M241 4C214 60 4 318 4 490A237 237 0 0 0 478 490C478 318 268 60 241 4Z" fill="url(#pgGlass)"/>
    <path class="pg-outline" d="M241 4C214 60 4 318 4 490A237 237 0 0 0 478 490C478 318 268 60 241 4Z" fill="none" stroke="url(#pgLine)" stroke-width="2.6" stroke-linejoin="round" pathLength="1"/>
  </g>
  <g class="pg-inner" filter="url(#pgShadow)">
    <circle class="pg-core" cx="327" cy="548" r="60" fill="url(#pgCore)" stroke="#fff" stroke-width="2.6"/>
  <g class="pg-arc" style="--i:0">
    <path class="pg-glass" d="M232.7 504.0A104 104 0 0 0 371.0 642.3" stroke="rgba(255,255,255,0.34)" stroke-width="24" stroke-linecap="round" fill="none"/>
    <rect class="pg-line" mask="url(#pgm0)" x="0" y="0" width="520" height="760" fill="#fff"/>
  </g>
  <g class="pg-arc" style="--i:1">
    <path class="pg-glass" d="M259.9 448.5A120 120 0 0 1 439.8 589.0" stroke="rgba(255,255,255,0.34)" stroke-width="24" stroke-linecap="round" fill="none"/>
    <rect class="pg-line" mask="url(#pgm1)" x="0" y="0" width="520" height="760" fill="#fff"/>
  </g>
  <g class="pg-arc" style="--i:2">
