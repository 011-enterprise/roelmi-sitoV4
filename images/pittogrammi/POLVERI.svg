<svg class="pg pg--powder" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 760" aria-hidden="true" focusable="false">
  <defs>
    <!-- Vetro: più chiaro in alto a sinistra (luce), quasi trasparente in basso a destra -->
    <linearGradient id="pgGlass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.22"/>
    </linearGradient>
    <!-- Contorno: pieno dove batte la luce, più tenue nell'ombra -->
    <linearGradient id="pgLine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.6" stop-color="#fff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.9"/>
    </linearGradient>
    <!-- Ombra dei granelli sulla goccia: profondità -->
    <filter id="pgShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="9" stdDeviation="8" flood-color="#191919" flood-opacity="0.2"/>
    </filter>
    <radialGradient id="pgCore" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#fff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.16"/>
    </radialGradient>
  </defs>
  <g class="pg-drop">
    <path class="pg-glass" d="M241 4C214 60 4 318 4 490A237 237 0 0 0 478 490C478 318 268 60 241 4Z" fill="url(#pgGlass)"/>
    <path class="pg-outline" d="M241 4C214 60 4 318 4 490A237 237 0 0 0 478 490C478 318 268 60 241 4Z" fill="none" stroke="url(#pgLine)" stroke-width="2.6" stroke-linejoin="round" pathLength="1"/>
  </g>
  <g class="pg-inner" filter="url(#pgShadow)">
    <circle class="pg-grain" style="--i:0" cx="254" cy="443" r="47" fill="url(#pgCore)" stroke="#fff" stroke-width="2.6"/>
    <circle class="pg-grain" style="--i:1" cx="403" cy="443" r="48" fill="url(#pgCore)" stroke="#fff" stroke-width="2.6"/>
    <circle class="pg-grain" style="--i:2" cx="181" cy="572" r="48" fill="url(#pgCore)" stroke="#fff" stroke-width="2.6"/>
    <circle class="pg-grain" style="--i:3" cx="327" cy="573" r="51" fill="url(#pgCore)" stroke="#fff" stroke-width="2.6"/>
    <circle class="pg-grain" style="--i:4" cx="474" cy="573" r="56" fill="url(#pgCore)" stroke="#fff" stroke-width="2.6"/>
    <circle class="pg-grain" style="--i:5" cx="254" cy="697" r="57" fill="url(#pgCore)" stroke="#fff" stroke-width="2.6"/>
    <circle class="pg-grain" style="--i:6" cx="402" cy="694" r="62" fill="url(#pgCore)" stroke="#fff" stroke-width="2.6"/>
  </g>
</svg>
